<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <main class="formbox">
        <div class="button-box" role="tablist" aria-label="Authentication">
            <div id="btn" aria-hidden="true"></div>
            <button type="button" class="change-btn" onclick="login()" role="tab" aria-controls="login">
                <span>LogIn</span>
            </button>
            <button type="button" class="change-btn" onclick="register()" role="tab" aria-controls="Register">
                <span>Register</span>
            </button>
        </div>

        <div class="social" aria-label="Social login options">
            <a href="#" aria-label="Sign in with Google"><i class="fa-brands fa-google" aria-hidden="true"></i></a>
            <a href="#" aria-label="Sign in with Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a>
            <a href="#" aria-label="Sign in with LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
        </div>

        <form id="login" class="logindata">
            <input type="text" class="name-pass" placeholder="Enter username" aria-label="Username" required>
            <input type="password" class="name-pass" placeholder="Password" aria-label="Password" required>

            <label class="remmeber-pass">
                <input type="checkbox" class="check-box">
                <span>Remember Password</span>
            </label>

            <button type="submit" class="submit-btn">Submit</button>
        </form>

        <form id="Register" class="logindata">
            <input type="text" class="name-pass" placeholder="Enter username" aria-label="Username" required>
            <input type="email" class="name-pass" placeholder="Email Id" aria-label="Email address" required>
            <input type="password" class="name-pass" placeholder="Password" aria-label="Password" required>

            <label class="terms">
                <input type="checkbox" class="check-box" required>
                <span>I Agree To The Terms and Conditions</span>
            </label>

            <button type="submit" class="submit-btn">Register</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
